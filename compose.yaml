services:
  tap-late:
    build: .
    ports:
      - "${TAPLATE_BIND_ADDRESS:-0.0.0.0}:${TAPLATE_PORT:-8000}:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.1-sol}
      TAPLATE_RETENTION_DAYS: ${TAPLATE_RETENTION_DAYS:-7}
      TAPLATE_OCR_DEVICE: ${TAPLATE_OCR_DEVICE:-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - tap-late-data:/data
    restart: unless-stopped
volumes:
  tap-late-data:
