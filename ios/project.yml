name: TapLate
options:
  bundleIdPrefix: com.jeemzy
  deploymentTarget:
    iOS: '27.0'
  xcodeVersion: '27.2'
  projectFormat: xcode27_0
packages:
  TapLateCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    IPHONEOS_DEPLOYMENT_TARGET: '27.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  TapLate:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: TapLateCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeemzy.taplate
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: tap-late
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [screen-capture, audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  TapLateTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: TapLate
      - package: TapLateCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TapLateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TapLate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TapLate:
    build:
      targets:
        TapLate: all
    test:
      targets: [TapLateTests, TapLateUITests]
