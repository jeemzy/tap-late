name: iOS
run-name: ${{ github.ref_type == 'tag' && format('iOS Build {0}', github.ref_name) || 'iOS' }}

on:
  push:
    branches: [codex/ios-stage1]
    tags: ['ios-build/*']
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      build_device:
        description: 'Build the unsigned iPhone IPA for iloader'
        type: boolean
        default: true
      run_simulator_tests:
        description: 'Run native integration and UI tests on the iOS simulator'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  core-tests:
    concurrency:
      group: ios-core-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift toolchain
        run: swift --version
      - name: Test public Session behavior
        run: swift test --package-path ios
  device-build:
    # ios-builder's Git-only trigger packages the commit at the build tag.
    if: (github.event_name == 'workflow_dispatch' && inputs.build_device) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ios-build/'))
    concurrency:
      group: ios-device-${{ github.ref }}
      cancel-in-progress: true
    needs: core-tests
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned XcodeGen
        run: bash ios/scripts/generate-project.sh
      - name: Build unsigned device app
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -1)" = 'Xcode 27.2'
          set -o pipefail
          xcodebuild -project ios/TapLate.xcodeproj -scheme TapLate -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} build | tee "$RUNNER_TEMP/device-build.log"
      - name: Package IPA for local iloader signing
        run: |
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto ios/build/Build/Products/Release-iphoneos/TapLate.app "$RUNNER_TEMP/package/Payload/TapLate.app"
          cd "$RUNNER_TEMP/package"
          ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/tap-late-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: tap-late-unsigned
          path: tap-late-unsigned.ipa
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: device-build-log
          path: ${{ runner.temp }}/device-build.log
  simulator-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.run_simulator_tests
    concurrency:
      group: ios-simulator-${{ github.ref }}
      cancel-in-progress: true
    needs: core-tests
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: bash ios/scripts/generate-project.sh
      - name: Select iPhone 17 Pro Max on iOS 27.2
        run: |
          SIMULATOR_ID=$(python3 ios/scripts/select-simulator.py)
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Test native import, storage, OCR and viewer
        run: |
          set -o pipefail
          xcodebuild test -project ios/TapLate.xcodeproj -scheme TapLate -configuration Debug -destination "id=$SIMULATOR_ID" -derivedDataPath ios/build -resultBundlePath ios/build/Simulator.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/simulator-build.log"
      - name: Export native screenshots
        if: always()
        run: |
          if [ -d ios/build/Simulator.xcresult ]; then
            xcrun xcresulttool export attachments --path ios/build/Simulator.xcresult --output-path ios/build/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-verification
          path: |
            ios/build/screenshots
            ios/build/Simulator.xcresult
            ${{ runner.temp }}/simulator-build.log
          retention-days: 14
