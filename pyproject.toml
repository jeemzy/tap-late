[project]
name = "tap-late"
version = "0.1.0"
description = "A self-hosted Chinese screenshot translator"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.8,<3", "pillow>=13,<14", "numpy>=2,<3",
  "openai>=3.49,<4", "rapidocr==3.10.0", "onnxruntime-gpu[cuda,cudnn]==1.26.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
